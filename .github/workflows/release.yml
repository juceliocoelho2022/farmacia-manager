name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publicar Release com o JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar dist/SistemaFarmacia.jar
        run: bash build.sh

      - name: Criar a Release e anexar o JAR
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SistemaFarmacia.jar
          generate_release_notes: true
